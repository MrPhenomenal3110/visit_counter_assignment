apiVersion: apps/v1
kind: Deployment
metadata:
  name: visit-counter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: visit-counter
  template:
    metadata:
      labels:
        app: visit-counter
    spec:
      imagePullSecrets:
      - name: dockerhub-creds
      containers:
      - name: app
        image: DOCKERHUB_USERNAME/IMAGE_NAME:IMAGE_TAG
        ports:
        - containerPort: 8000