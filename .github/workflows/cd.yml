name: CD Pipeline

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install eksctl
        run: |
          curl --silent --location "https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin
          eksctl version

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          eksctl utils write-kubeconfig --cluster ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy to Kubernetes
        run: |
          # Use latest tag for manual deployments (most recent validated image from CI)
          kubectl set image deployment/visit-counter app=${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:latest -n default
          kubectl rollout status deployment/visit-counter -n default --timeout=300s

      - name: DAST - Basic Health Check
        run: |
          # Get service endpoint (assuming LoadBalancer or NodePort)
          # This is a placeholder for DAST - in production, use proper DAST tools
          echo "DAST: Performing basic health check on deployed service"
          # Extract service endpoint and test
          SERVICE_URL=$(kubectl get svc visit-counter -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
          if [ -z "$SERVICE_URL" ]; then
            echo "Service endpoint not available via LoadBalancer, skipping external health check"
            echo "DAST placeholder: Service is running and accessible internally"
          else
            echo "Testing service at: $SERVICE_URL"
            curl -f http://$SERVICE_URL/ || echo "Health check failed"
          fi
